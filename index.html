<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftTrack Solutions - Tracking</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for a professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- HEADER/NAVIGATION BAR for realism -->
    <header class="main-nav">
        <a href="#home" class="nav-logo">SwiftTrack Solutions</a>
        <nav>
            <a href="#track">Track</a>
            <a href="#services">Services</a>
            <a href="#support">Support</a>
            <a href="#login">Login</a>
        </nav>
    </header>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="content-wrapper">
        <div class="container">
            <header class="tracker-header">
                <!-- Ensure you have a 'logo.png' in your folder -->
                <img src="logo.png" onerror="this.onerror=null;this.src='https://placehold.co/50x50/2193b0/ffffff?text=ST';" alt="SwiftTrack Logo" class="logo">
                <h1>Package Tracking</h1>
            </header>
            
            <!-- NEW PACKAGE ICON BELOW HEADER (SVG) -->
            <svg class="package-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- This path represents a simple, recognizable 2D package box -->
                <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 18z"></path>
                <path d="M3 8l9 5 9-5"></path>
                <path d="M12 22V13"></path>
            </svg>
            <!-- END NEW ICON -->
            
            <p class="tagline">Your trusted partner in delivery tracking.</p>
            <p>Enter your 9-digit tracking number below to view the latest status:</p>
            
            <!-- The input field where the user enters the number -->
            <input type="text" id="trackingInput" placeholder="e.g., 123456789" maxlength="9">
            
            <!-- The button to trigger the JavaScript function -->
            <button onclick="trackPackage()">Track My Package</button>
            
            <!-- The display area for the status result -->
            <div id="statusResult">
                
            </div>
        </div>
    </main>

    <!-- FOOTER for professionalism -->
    <footer class="main-footer">
        &copy; 2024 SwiftTrack Solutions. All rights reserved. | <a href="#privacy">Privacy Policy</a>
    </footer>

    <!-- Link to the control logic file -->
    <script src="script.js"></script>
</body>
</html>
